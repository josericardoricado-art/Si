<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — Dublagem AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell" style="max-width:520px;padding-top:8vh"><div class="card"><div class="logo">Dublagem<span>AI</span></div><h1>Crie sua conta</h1><form id="f"><input class="input" name="name" placeholder="Nome" required><input class="input" name="email" type="email" placeholder="E-mail" required><input class="input" name="password" type="password" minlength="6" placeholder="Senha (6+ caracteres)" required><button class="btn green" style="width:100%">Criar conta</button><p id="e" class="muted"></p></form><p>Já tem conta? <a href="login.html" style="color:#24d6a4">Entrar</a></p></div></main><script src="app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});localStorage.setItem('dai_token',d.token);localStorage.setItem('dai_user',JSON.stringify(d.user));location.href='index.html'}catch(x){document.querySelector('#e').textContent=x.message}}</script></body></html>
