<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Dublagem AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell" style="max-width:520px;padding-top:8vh"><div class="card"><div class="logo">Dublagem<span>AI</span></div><h1>Bem-vindo de volta</h1><p class="muted">Entre para traduzir e dublar seus vídeos.</p><form id="f"><input class="input" name="email" type="email" placeholder="Seu e-mail" required><input class="input" name="password" type="password" placeholder="Sua senha" required><button class="btn" style="width:100%">Entrar</button><p id="e" class="muted"></p></form><p>Não tem conta? <a href="register.html" style="color:#24d6a4">Criar conta</a></p></div></main><script src="app.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});localStorage.setItem('dai_token',d.token);localStorage.setItem('dai_user',JSON.stringify(d.user));location.href='index.html'}catch(x){document.querySelector('#e').textContent=x.message}}</script></body></html>
