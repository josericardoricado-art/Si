<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>SI Tradutor Live</title>

<meta
name="description"
content="SI Tradutor Live — tradução de transmissões do YouTube para português com voz IA."

>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #0f172a,
      #111827,
      #1e293b
    );

  color: white;

  min-height: 100vh;
}

.container {

  max-width: 1100px;

  margin:
    auto;

  padding:
    20px;
}

header {

  text-align:
    center;

  padding:
    25px 10px;
}

.logo {

  font-size:
    34px;

  font-weight:
    800;
}

.subtitle {

  margin-top:
    8px;

  color:
    #cbd5e1;
}

.card {

  background:
    rgba(
      255,
      255,
      255,
      0.08
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.12
    );

  border-radius:
    18px;

  padding:
    20px;

  margin-bottom:
    20px;
}

.status {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  margin-bottom:
    18px;

  color:
    #cbd5e1;
}

.dot {

  width:
    11px;

  height:
    11px;

  border-radius:
    50%;

  background:
    #f59e0b;
}

.dot.online {

  background:
    #22c55e;
}

.dot.error {

  background:
    #ef4444;
}

label {

  display:
    block;

  font-weight:
    700;

  margin-bottom:
    8px;
}

input,
select {

  width:
    100%;

  padding:
    14px;

  border:
    none;

  border-radius:
    12px;

  font-size:
    16px;

  margin-bottom:
    14px;
}

.buttons {

  display:
    flex;

  gap:
    10px;

  flex-wrap:
    wrap;
}

button {

  border:
    none;

  border-radius:
    12px;

  padding:
    14px 20px;

  font-size:
    16px;

  font-weight:
    700;

  cursor:
    pointer;

  flex:
    1;
}

button:disabled {

  opacity:
    .5;

  cursor:
    not-allowed;
}

.start {

  background:
    #22c55e;

  color:
    white;
}

.stop {

  background:
    #ef4444;

  color:
    white;
}

.audio {

  background:
    #2563eb;

  color:
    white;
}

.video {

  position:
    relative;

  width:
    100%;

  padding-top:
    56.25%;

  background:
    black;

  border-radius:
    16px;

  overflow:
    hidden;
}

.video iframe {

  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

  border:
    none;
}

.empty {

  position:
    absolute;

  inset:
    0;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  color:
    #94a3b8;

  text-align:
    center;
}

.translation {

  min-height:
    150px;

  background:
    rgba(
      0,
      0,
      0,
      .25
    );

  border-radius:
    14px;

  padding:
    20px;
}

.translation-title {

  color:
    #94a3b8;

  font-size:
    14px;

  margin-bottom:
    12px;
}

#translation {

  font-size:
    24px;

  line-height:
    1.5;

  font-weight:
    600;
}

.message {

  margin-top:
    15px;

  padding:
    13px;

  background:
    rgba(
      255,
      255,
      255,
      .06
    );

  border-radius:
    10px;

  color:
    #cbd5e1;

  white-space:
    pre-wrap;
}

.live {

  display:
    inline-flex;

  align-items:
    center;

  gap:
    7px;

  background:
    rgba(
      239,
      68,
      68,
      .15
    );

  color:
    #fca5a5;

  padding:
    7px 11px;

  border-radius:
    999px;

  margin-bottom:
    15px;
}

.live-dot {

  width:
    8px;

  height:
    8px;

  border-radius:
    50%;

  background:
    #ef4444;
}

footer {

  text-align:
    center;

  color:
    #64748b;

  padding:
    20px;
}

@media(max-width:600px) {

  .container {
    padding: 12px;
  }

  .logo {
    font-size: 28px;
  }

  .card {
    padding: 15px;
  }

  #translation {
    font-size: 19px;
  }

  .buttons {
    flex-direction: column;
  }

}

</style>

</head>

<body>

<div class="container">

<header>

<div class="logo">
🎙️ SI Tradutor Live
</div>

<div class="subtitle">
YouTube Live → Português → Voz ElevenLabs
</div>

</header>

<!-- CONTROLE -->

<div class="card">

<div class="status">

<span
id="statusDot"
class="dot"

> </span>

<span id="connection">
Verificando servidor...
</span>

</div>

<label>
Cole o link da YouTube Live
</label>

<input
id="youtubeUrl"
type="url"
placeholder="https://www.youtube.com/live/..."

>

<label>
Idioma da tradução
</label>

<select id="targetLang">

<option value="pt">
🇧🇷 Português
</option>

</select>

<div class="buttons">

<button
id="startButton"
class="start"
onclick="startLive()"

>

🔴 Iniciar tradução </button>

<button
id="stopButton"
class="stop"
onclick="stopLive()"
disabled

>

🛑 Parar </button>

<button
id="audioButton"
class="audio"
onclick="enableAudio()"
disabled

>

🔊 Ativar áudio </button>

</div>

<div
  id="message"
  class="message"
>
Cole o link da YouTube Live para começar.
</div>

</div>

<!-- VÍDEO -->

<div class="card">

<div class="live">

<span class="live-dot"></span>

YouTube Live

</div>

<div
  id="video"
  class="video"
>

<div class="empty">
O vídeo da live aparecerá aqui.
</div>

</div>

</div>

<!-- TRADUÇÃO -->

<div class="card">

<div class="translation">

<div class="translation-title">
📝 Tradução para português
</div>

<div id="translation">
A tradução aparecerá aqui...
</div>

</div>

</div>

<footer>
SI Tradutor Live • Powered by ElevenLabs
</footer>

</div>

<script>


// ========================================================
// CONFIGURAÇÃO
// ========================================================

const BACKEND_URL =
  "https://si-u2ul.onrender.com";


let liveId = null;

let statusTimer = null;

let audioTimer = null;

let audioEnabled = false;

let audioPlayer = null;


// ========================================================
// ELEMENTOS
// ========================================================

const youtubeUrl =
  document.getElementById(
    "youtubeUrl"
  );

const targetLang =
  document.getElementById(
    "targetLang"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const audioButton =
  document.getElementById(
    "audioButton"
  );

const message =
  document.getElementById(
    "message"
  );

const translation =
  document.getElementById(
    "translation"
  );

const video =
  document.getElementById(
    "video"
  );

const connection =
  document.getElementById(
    "connection"
  );

const statusDot =
  document.getElementById(
    "statusDot"
  );


// ========================================================
// MENSAGEM
// ========================================================

function showMessage(text) {

  message.textContent =
    text || "";

}


// ========================================================
// YOUTUBE ID
// ========================================================

function getYouTubeId(url) {

  if (!url) {
    return null;
  }

  const patterns = [

    /youtube\.com\/live\/([^?&#/]+)/i,

    /youtube\.com\/watch\?v=([^&#]+)/i,

    /youtu\.be\/([^?&#/]+)/i,

    /youtube\.com\/embed\/([^?&#/]+)/i

  ];

  for (
    const pattern
    of patterns
  ) {

    const match =
      url.match(pattern);

    if (match) {

      return match[1];

    }

  }

  return null;

}


// ========================================================
// MOSTRAR YOUTUBE
// ========================================================

function showYouTube(videoId) {

  video.innerHTML = `

    <iframe
      src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1&rel=0"
      title="YouTube Live"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen
    ></iframe>

  `;

}


// ========================================================
// SERVIDOR
// ========================================================

async function checkServer() {

  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/health"
      );

    const data =
      await response.json();

    if (
      response.ok &&
      data.ok
    ) {

      connection.textContent =
        "🟢 Servidor conectado à ElevenLabs";

      statusDot.classList.add(
        "online"
      );

      statusDot.classList.remove(
        "error"
      );

    } else {

      throw new Error(
        data.message ||
        "Servidor não conectado."
      );

    }

  } catch (error) {

    connection.textContent =
      "🔴 Servidor não conectado";

    statusDot.classList.remove(
      "online"
    );

    statusDot.classList.add(
      "error"
    );

  }

}


// ========================================================
// INICIAR
// ========================================================

async function startLive() {

  const url =
    youtubeUrl.value.trim();

  if (!url) {

    showMessage(
      "Cole o link da YouTube Live."
    );

    return;

  }

  const videoId =
    getYouTubeId(url);

  if (!videoId) {

    showMessage(
      "Link do YouTube inválido."
    );

    return;

  }


  startButton.disabled =
    true;

  stopButton.disabled =
    false;

  audioButton.disabled =
    false;


  showYouTube(videoId);


  translation.textContent =
    "Conectando à live...";


  showMessage(
    "🔴 Enviando a live para o servidor..."
  );


  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/youtube-live",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              url:
                url,

              targetLang:
                targetLang.value

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        data.message ||
        "Erro iniciando live."
      );

    }


    liveId =
      data.liveId;


    showMessage(
      "🔴 Live iniciada. "
      + "O servidor está capturando o áudio."
    );


    startStatusPolling();

    startAudioPolling();


  } catch (error) {

    showMessage(
      "❌ " +
      error.message
    );

    resetInterface();

  }

}


// ========================================================
// STATUS
// ========================================================

function startStatusPolling() {

  if (statusTimer) {

    clearInterval(
      statusTimer
    );

  }

  statusTimer =
    setInterval(
      checkLiveStatus,
      2500
    );

  checkLiveStatus();

}


async function checkLiveStatus() {

  if (!liveId) {
    return;
  }

  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/youtube-live/" +
        encodeURIComponent(
          liveId
        )
      );

    const data =
      await response.json();


    if (!data.ok) {
      return;
    }


    if (
      data.lastTranslation
    ) {

      translation.textContent =
        data.lastTranslation;

    }


    if (
      data.status ===
      "capturing"
    ) {

      showMessage(
        "🎙️ Capturando áudio da YouTube Live..."
      );

    }


    if (
      data.audioCapture ===
      "running"
    ) {

      showMessage(
        "🟢 Tradução ativa e conectada ao servidor."
      );

    }


    if (
      data.status ===
      "translating"
    ) {

      showMessage(
        "🌎 Traduzindo e gerando voz..."
      );

    }


    if (
      data.error
    ) {

      showMessage(
        "⚠️ " +
        data.error
      );

    }


    if (
      data.status ===
      "error"
    ) {

      showMessage(
        "❌ " +
        (
          data.error ||
          data.message ||
          "Erro no processamento."
        )
      );

    }

  } catch (error) {

    console.log(
      "Status:",
      error
    );

  }

}


// ========================================================
// ÁUDIO
// ========================================================

function startAudioPolling() {

  if (audioTimer) {

    clearInterval(
      audioTimer
    );

  }

  audioTimer =
    setInterval(
      checkAudio,
      1500
    );

}


async function checkAudio() {

  if (!liveId) {
    return;
  }

  if (!audioEnabled) {
    return;
  }


  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/youtube-live/" +
        encodeURIComponent(
          liveId
        ) +
        "/audio"
      );


    if (
      response.status === 404
    ) {

      return;

    }


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if (
      !contentType.includes(
        "audio"
      )
    ) {

      return;

    }


    const blob =
      await response.blob();


    const audioUrl =
      URL.createObjectURL(
        blob
      );


    if (audioPlayer) {

      audioPlayer.pause();

    }


    audioPlayer =
      new Audio(
        audioUrl
      );


    audioPlayer.volume =
      1;


    audioPlayer.play()
      .catch(
        error => {

          console.log(
            "Erro tocando áudio:",
            error
          );

        }
      );


    audioPlayer.onended =
      function() {

        URL.revokeObjectURL(
          audioUrl
        );

      };


  } catch (error) {

    console.log(
      "Áudio:",
      error
    );

  }

}


// ========================================================
// ATIVAR ÁUDIO
// ========================================================

async function enableAudio() {

  try {

    audioEnabled =
      true;


    audioButton.textContent =
      "🔊 Áudio ativado";

    audioButton.disabled =
      true;


    showMessage(
      "🔊 Áudio da tradução ativado."
    );


    // Cria um pequeno elemento de áudio
    // para liberar reprodução após
    // interação do usuário.

    const testAudio =
      new Audio();

    testAudio.volume =
      0;


    try {

      await testAudio.play();

    } catch (_) {
      // Alguns navegadores bloqueiam
      // áudio vazio. Isso não impede
      // os próximos áudios.
    }


  } catch (error) {

    showMessage(
      "Erro ativando áudio: "
      + error.message
    );

  }

}


// ========================================================
// PARAR
// ========================================================

async function stopLive() {

  if (!liveId) {

    resetInterface();

    return;

  }


  try {

    await fetch(
      BACKEND_URL +
      "/api/youtube-live/" +
      encodeURIComponent(
        liveId
      ) +
      "/stop",
      {
        method:
          "POST"
      }
    );

  } catch (error) {

    console.log(
      error
    );

  }


  if (statusTimer) {

    clearInterval(
      statusTimer
    );

    statusTimer =
      null;

  }


  if (audioTimer) {

    clearInterval(
      audioTimer
    );

    audioTimer =
      null;

  }


  if (audioPlayer) {

    audioPlayer.pause();

    audioPlayer =
      null;

  }


  liveId =
    null;


  resetInterface();

}


// ========================================================
// RESET
// ========================================================

function resetInterface() {

  startButton.disabled =
    false;

  stopButton.disabled =
    true;

  audioButton.disabled =
    true;

  audioButton.textContent =
    "🔊 Ativar áudio";

  audioEnabled =
    false;


  translation.textContent =
    "A tradução aparecerá aqui...";


  showMessage(
    "Live parada."
  );

}


// ========================================================
// INICIALIZAÇÃO
// ========================================================

checkServer();

</script>

</body>

</html>
