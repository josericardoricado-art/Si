<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dublagem automática de vídeos</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --text-muted: #9a9da6;
    --accent: #6c5ce7;
    --accent-hover: #5b4bd1;
    --success: #2ecc71;
    --error: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
  p.sub { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  input[type="file"], select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #11131a;
    color: var(--text);
    margin-bottom: 16px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin-top: 24px; font-size: 14px; }
  .bar-bg {
    width: 100%;
    height: 8px;
    background: #11131a;
    border-radius: 4px;
    overflow: hidden;
    margin: 12px 0;
    display: none;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
  .stage { color: var(--text-muted); font-size: 13px; }
  a.download {
    display: inline-block;
    margin-top: 12px;
    color: var(--success);
    text-decoration: none;
    font-weight: 500;
  }
  .error { color: var(--error); }
</style>
</head>
<body>
  <div class="card">
    <h1>Dublagem automática de vídeos</h1>
    <p class="sub">Envie um vídeo seu e escolha o idioma da dublagem.</p>

    <form id="form">
      <label for="video">Vídeo</label>
      <input type="file" id="video" name="video" accept="video/*" required>

      <label for="targetLang">Idioma de destino</label>
      <select id="targetLang" name="targetLang">
        <option value="pt">Português</option>
        <option value="en">Inglês</option>
        <option value="es">Espanhol</option>
      </select>

      <button type="submit" id="submitBtn">Dublar vídeo</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    // Ajuste para a URL do seu backend em produção
    const API_BASE = "http://localhost:3000";

    const form = document.getElementById("form");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.innerHTML = "";

      const fileInput = document.getElementById("video");
      const targetLang = document.getElementById("targetLang").value;

      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append("video", fileInput.files[0]);
      formData.append("targetLang", targetLang);

      try {
        const res = await fetch(`${API_BASE}/api/dublar`, {
          method: "POST",
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Erro ao enviar o vídeo.");

        statusEl.innerHTML = `
          <div class="stage" id="stageText">Na fila...</div>
          <div class="bar-bg" id="barBg" style="display:block">
            <div class="bar-fill" id="barFill"></div>
          </div>
        `;

        pollStatus(data.jobId);
      } catch (err) {
        statusEl.innerHTML = `<div class="error">${err.message}</div>`;
        submitBtn.disabled = false;
      }
    });

    function pollStatus(jobId) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`${API_BASE}/api/status/${jobId}`);
          const data = await res.json();

          document.getElementById("stageText").textContent = data.stage || data.status;
          document.getElementById("barFill").style.width = `${data.progress || 0}%`;

          if (data.status === "done") {
            clearInterval(interval);
            statusEl.innerHTML += `<a class="download" href="${API_BASE}${data.downloadUrl}" target="_blank">Baixar vídeo dublado</a>`;
            submitBtn.disabled = false;
          }

          if (data.status === "error") {
            clearInterval(interval);
            statusEl.innerHTML += `<div class="error">Erro: ${data.error}</div>`;
            submitBtn.disabled = false;
          }
        } catch (err) {
          clearInterval(interval);
          statusEl.innerHTML += `<div class="error">Falha ao consultar status.</div>`;
          submitBtn.disabled = false;
        }
      }, 2000);
    }
  </script>
</body>
</html>
