<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SI Tradutor Live</title>

<meta
  name="description"
  content="SI Tradutor Live — tradução de transmissões ao vivo."
>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #0f172a,
      #111827,
      #1e293b
    );

  color: white;

  min-height: 100vh;
}

.container {

  max-width: 1100px;

  margin: auto;

  padding: 20px;
}

header {

  text-align: center;

  padding: 25px 10px;
}

.logo {

  font-size: 34px;

  font-weight: 800;
}

.subtitle {

  margin-top: 8px;

  color: #cbd5e1;
}

.card {

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 20px;
}

.status {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-bottom: 18px;

  color: #cbd5e1;
}

.dot {

  width: 11px;

  height: 11px;

  border-radius: 50%;

  background: #f59e0b;
}

.dot.online {

  background: #22c55e;
}

.dot.error {

  background: #ef4444;
}

label {

  display: block;

  font-weight: 700;

  margin-bottom: 8px;
}

input,
select {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 12px;

  font-size: 16px;

  margin-bottom: 14px;
}

.buttons {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;
}

button {

  border: none;

  border-radius: 12px;

  padding: 14px 20px;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;

  flex: 1;
}

button:disabled {

  opacity: .5;

  cursor: not-allowed;
}

.start {

  background: #22c55e;

  color: white;
}

.stop {

  background: #ef4444;

  color: white;
}

.audio {

  background: #2563eb;

  color: white;
}

.video {

  position: relative;

  width: 100%;

  padding-top: 56.25%;

  background: black;

  border-radius: 16px;

  overflow: hidden;
}

.video iframe {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  border: none;
}

.empty {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #94a3b8;

  text-align: center;

  padding: 20px;
}

.translation {

  min-height: 150px;

  background:
    rgba(0,0,0,.25);

  border-radius: 14px;

  padding: 20px;
}

.translation-title {

  color: #94a3b8;

  font-size: 14px;

  margin-bottom: 12px;
}

#translation {

  font-size: 24px;

  line-height: 1.5;

  font-weight: 600;
}

.message {

  margin-top: 15px;

  padding: 13px;

  background:
    rgba(255,255,255,.06);

  border-radius: 10px;

  color: #cbd5e1;

  white-space: pre-wrap;
}

.live {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  background:
    rgba(239,68,68,.15);

  color: #fca5a5;

  padding: 7px 11px;

  border-radius: 999px;

  margin-bottom: 15px;
}

.live-dot {

  width: 8px;

  height: 8px;

  border-radius: 50%;

  background: #ef4444;
}

footer {

  text-align: center;

  color: #64748b;

  padding: 20px;
}

@media(max-width:600px) {

  .container {
    padding: 12px;
  }

  .logo {
    font-size: 28px;
  }

  .card {
    padding: 15px;
  }

  #translation {
    font-size: 19px;
  }

  .buttons {
    flex-direction: column;
  }

}

</style>

</head>

<body>

<div class="container">

<header>

<div class="logo">
🎙️ SI Tradutor Live
</div>

<div class="subtitle">
YouTube Live → Áudio → Tradução → ElevenLabs
</div>

</header>


<div class="card">

<div class="status">

<span
  id="statusDot"
  class="dot"
></span>

<span id="connection">
Verificando servidor...
</span>

</div>


<label>
Cole o link da YouTube Live
</label>

<input
  id="youtubeUrl"
  type="url"
  placeholder="https://www.youtube.com/live/..."
>


<label>
Idioma da tradução
</label>

<select id="targetLang">

<option value="pt">
🇧🇷 Português
</option>

<option value="en">
🇺🇸 Inglês
</option>

<option value="es">
🇪🇸 Espanhol
</option>

</select>


<div class="buttons">

<button
  id="startButton"
  class="start"
  onclick="startLive()"
>
🔴 Iniciar tradução
</button>

<button
  id="stopButton"
  class="stop"
  onclick="stopLive()"
  disabled
>
🛑 Parar
</button>

<button
  id="audioButton"
  class="audio"
  onclick="enableAudio()"
  disabled
>
🎙️ Capturar áudio
</button>

</div>


<div
  id="message"
  class="message"
>
Cole o link da YouTube Live para começar.
</div>

</div>


<div class="card">

<div class="live">

<span class="live-dot"></span>

YouTube Live

</div>

<div
  id="video"
  class="video"
>

<div class="empty">
O vídeo da live aparecerá aqui.
</div>

</div>

</div>


<div class="card">

<div class="translation">

<div class="translation-title">
📝 Tradução
</div>

<div id="translation">
A tradução aparecerá aqui...
</div>

</div>

</div>


<footer>

SI Tradutor Live • Powered by ElevenLabs

</footer>

</div>


<script>


// ========================================================
// BACKEND
// ========================================================

const BACKEND_URL =
  "https://si-u2ul.onrender.com";


let sessionId = null;

let mediaStream = null;

let mediaRecorder = null;

let statusTimer = null;


// ========================================================
// ELEMENTOS
// ========================================================

const youtubeUrl =
  document.getElementById(
    "youtubeUrl"
  );

const targetLang =
  document.getElementById(
    "targetLang"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const stopButton =
  document.getElementById(
    "stopButton"
  );

const audioButton =
  document.getElementById(
    "audioButton"
  );

const message =
  document.getElementById(
    "message"
  );

const translation =
  document.getElementById(
    "translation"
  );

const video =
  document.getElementById(
    "video"
  );

const connection =
  document.getElementById(
    "connection"
  );

const statusDot =
  document.getElementById(
    "statusDot"
  );


// ========================================================
// MENSAGEM
// ========================================================

function showMessage(text) {

  message.textContent =
    text || "";

}


// ========================================================
// YOUTUBE ID
// ========================================================

function getYouTubeId(url) {

  if (!url) {
    return null;
  }

  const patterns = [

    /youtube\.com\/live\/([^?&#/]+)/i,

    /youtube\.com\/watch\?v=([^&#]+)/i,

    /youtu\.be\/([^?&#/]+)/i,

    /youtube\.com\/embed\/([^?&#/]+)/i

  ];

  for (
    const pattern of patterns
  ) {

    const match =
      url.match(pattern);

    if (match) {

      return match[1];

    }

  }

  return null;
}


// ========================================================
// MOSTRAR YOUTUBE
// ========================================================

function showYouTube(videoId) {

  video.innerHTML = `

    <iframe
      src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1"
      title="YouTube Live"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen
    ></iframe>

  `;

}


// ========================================================
// VERIFICAR SERVIDOR
// ========================================================

async function checkServer() {

  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/health"
      );

    const data =
      await response.json();

    if (
      response.ok &&
      data.ok
    ) {

      connection.textContent =
        "🟢 Servidor conectado";

      statusDot.classList.add(
        "online"
      );

      statusDot.classList.remove(
        "error"
      );

    } else {

      throw new Error(
        data.message ||
        "Servidor indisponível."
      );

    }

  } catch (error) {

    connection.textContent =
      "🔴 Servidor não conectado";

    statusDot.classList.remove(
      "online"
    );

    statusDot.classList.add(
      "error"
    );

  }

}


// ========================================================
// INICIAR
// ========================================================

async function startLive() {

  const url =
    youtubeUrl.value.trim();


  if (!url) {

    showMessage(
      "Cole o link da YouTube Live."
    );

    return;

  }


  const videoId =
    getYouTubeId(url);


  if (!videoId) {

    showMessage(
      "Link do YouTube inválido."
    );

    return;

  }


  startButton.disabled =
    true;

  stopButton.disabled =
    false;

  audioButton.disabled =
    false;


  showYouTube(
    videoId
  );


  translation.textContent =
    "Preparando tradução...";


  showMessage(
    "🔴 Criando sessão..."
  );


  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/session",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              youtubeUrl:
                url,

              targetLang:
                targetLang.value

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Erro criando sessão."
      );

    }


    sessionId =
      data.sessionId;


    showMessage(
      "🟢 Sessão criada. Clique em 'Capturar áudio'."
    );


    startStatusPolling();


  } catch (error) {

    showMessage(
      "❌ " +
      error.message
    );

    resetInterface();

  }

}


// ========================================================
// CAPTURA DE ÁUDIO
// ========================================================

async function enableAudio() {

  if (!sessionId) {

    showMessage(
      "Primeiro inicie a tradução."
    );

    return;

  }


  try {

    showMessage(
      "🎙️ Selecione a aba/janela que contém a Live e marque a opção de compartilhar áudio."
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getDisplayMedia
    ) {

      throw new Error(
        "Este navegador não oferece captura de áudio da tela/aba."
      );

    }


    mediaStream =
      await navigator.mediaDevices.getDisplayMedia({

        video: true,

        audio: true

      });


    const audioTracks =
      mediaStream.getAudioTracks();


    if (
      !audioTracks.length
    ) {

      mediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      mediaStream =
        null;


      throw new Error(
        "Nenhum áudio foi compartilhado. Ao selecionar a aba, marque 'Compartilhar áudio'."
      );

    }


    const audioStream =
      new MediaStream(
        audioTracks
      );


    let mimeType =
      "audio/webm";


    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      mimeType =
        "audio/webm;codecs=opus";

    }


    mediaRecorder =
      new MediaRecorder(
        audioStream,
        {
          mimeType:
            mimeType
        }
      );


    mediaRecorder.ondataavailable =
      async function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          await sendAudioChunk(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      function() {

        console.log(
          "Captura parada."
        );

      };


    mediaRecorder.start(
      3000
    );


    await fetch(

      BACKEND_URL +
      "/api/session/" +
      encodeURIComponent(
        sessionId
      ) +
      "/start",

      {
        method:
          "POST"
      }

    );


    audioButton.textContent =
      "🎙️ Áudio capturado";

    audioButton.disabled =
      true;


    showMessage(
      "🟢 Áudio da aba sendo enviado para o servidor."
    );


  } catch (error) {

    console.error(
      error
    );


    showMessage(
      "❌ " +
      error.message
    );

  }

}


// ========================================================
// ENVIAR BLOCO DE ÁUDIO
// ========================================================

async function sendAudioChunk(
  blob
) {

  if (!sessionId) {
    return;
  }


  try {

    const formData =
      new FormData();


    formData.append(
      "audio",
      blob,
      "live.webm"
    );


    const response =
      await fetch(

        BACKEND_URL +
        "/api/session/" +
        encodeURIComponent(
          sessionId
        ) +
        "/audio",

        {

          method:
            "POST",

          body:
            formData

        }

      );


    const data =
      await response.json();


    if (!data.ok) {

      console.log(
        "Áudio:",
        data.error
      );

    }

  } catch (error) {

    console.log(
      "Erro enviando áudio:",
      error
    );

  }

}


// ========================================================
// STATUS
// ========================================================

function startStatusPolling() {

  if (statusTimer) {

    clearInterval(
      statusTimer
    );

  }


  statusTimer =
    setInterval(
      checkStatus,
      2000
    );


  checkStatus();

}


async function checkStatus() {

  if (!sessionId) {
    return;
  }


  try {

    const response =
      await fetch(

        BACKEND_URL +
        "/api/session/" +
        encodeURIComponent(
          sessionId
        )

      );


    const data =
      await response.json();


    if (!data.ok) {
      return;
    }


    if (
      data.lastTranslation
    ) {

      translation.textContent =
        data.lastTranslation;

    }


    if (
      data.audioCapture ===
      "running"
    ) {

      showMessage(
        "🟢 Áudio sendo recebido pelo servidor."
      );

    }


    if (
      data.message
    ) {

      console.log(
        data.message
      );

    }


    if (
      data.error
    ) {

      showMessage(
        "⚠️ " +
        data.error
      );

    }

  } catch (error) {

    console.log(
      "Status:",
      error
    );

  }

}


// ========================================================
// PARAR
// ========================================================

async function stopLive() {

  if (mediaRecorder) {

    try {

      if (
        mediaRecorder.state !==
        "inactive"
      ) {

        mediaRecorder.stop();

      }

    } catch (_) {}

  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  if (sessionId) {

    try {

      await fetch(

        BACKEND_URL +
        "/api/session/" +
        encodeURIComponent(
          sessionId
        ) +
        "/stop",

        {
          method:
            "POST"
        }

      );

    } catch (_) {}

  }


  if (statusTimer) {

    clearInterval(
      statusTimer
    );

    statusTimer =
      null;

  }


  sessionId =
    null;

  mediaStream =
    null;

  mediaRecorder =
    null;


  resetInterface();

}


// ========================================================
// RESET
// ========================================================

function resetInterface() {

  startButton.disabled =
    false;

  stopButton.disabled =
    true;

  audioButton.disabled =
    true;

  audioButton.textContent =
    "🎙️ Capturar áudio";


  translation.textContent =
    "A tradução aparecerá aqui...";


  showMessage(
    "Live parada."
  );

}


// ========================================================
// INICIAR
// ========================================================

checkServer();

</script>

</body>

</html>
