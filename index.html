<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SI — Tradutor & Dublagem IA</title>

<meta
    name="description"
    content="Traduza e duble seus vídeos usando inteligência artificial."
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(
            circle at top,
            #24114d 0%,
            #0b0714 45%,
            #050509 100%
        );
    color: white;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 25px 18px 60px;
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    margin-top: 25px;
}

.subtitle {
    text-align: center;
    color: #cfc8dc;
    font-size: 18px;
    margin: 10px auto 35px;
}

.card {
    background: rgba(20, 15, 32, 0.94);
    border: 1px solid #3d3150;
    border-radius: 22px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.upload {
    border: 2px dashed #8056d9;
    border-radius: 18px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.upload:hover {
    background: rgba(128,86,217,.08);
}

.upload-icon {
    font-size: 50px;
    margin-bottom: 15px;
}

.upload strong {
    display: block;
    font-size: 20px;
    margin-bottom: 8px;
}

.upload span {
    color: #aaa;
}

input[type="file"] {
    display: none;
}

label {
    display: block;
    margin-top: 25px;
    margin-bottom: 8px;
    font-weight: bold;
}

select {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #4b3b60;
    background: #100b18;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 17px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(
        135deg,
        #8b5cf6,
        #6d28d9
    );
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.preview {
    display: none;
    margin-top: 25px;
}

.preview video {
    width: 100%;
    max-height: 450px;
    border-radius: 15px;
    background: black;
}

.status {
    display: none;
    margin-top: 25px;
    padding: 18px;
    border-radius: 14px;
    background: #120c1c;
    border: 1px solid #3d3150;
}

.status-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 10px;
    background: #2a2135;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #8b5cf6;
    transition: width .4s;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    background: #102015;
    border: 1px solid #31543b;
}

.result a {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #22c55e;
    color: white;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
    margin-top: 15px;
}

.connection {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #aaa;
}

.footer {
    text-align: center;
    color: #777;
    margin-top: 30px;
    font-size: 13px;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        SI
    </div>

    <div class="subtitle">
        Tradutor & Dublagem IA
    </div>

    <div class="card">

        <div
            class="upload"
            id="uploadArea"
            onclick="document.getElementById('videoInput').click()"
        >

            <div class="upload-icon">
                🎬
            </div>

            <strong>
                Escolha seu vídeo
            </strong>

            <span>
                Toque aqui para selecionar um vídeo
            </span>

        </div>

        <input
            id="videoInput"
            type="file"
            accept="video/*"
        >

        <div
            class="preview"
            id="preview"
        >

            <video
                id="videoPreview"
                controls
            ></video>

        </div>

        <label for="targetLang">
            Idioma da dublagem
        </label>

        <select id="targetLang">

            <option value="pt">
                🇧🇷 Português
            </option>

            <option value="en">
                🇺🇸 Inglês
            </option>

            <option value="es">
                🇪🇸 Espanhol
            </option>

            <option value="fr">
                🇫🇷 Francês
            </option>

            <option value="de">
                🇩🇪 Alemão
            </option>

            <option value="it">
                🇮🇹 Italiano
            </option>

            <option value="ja">
                🇯🇵 Japonês
            </option>

            <option value="ko">
                🇰🇷 Coreano
            </option>

            <option value="zh">
                🇨🇳 Chinês
            </option>

            <option value="ar">
                🇸🇦 Árabe
            </option>

        </select>

        <button
            id="dubButton"
            disabled
        >
            🎙️ Dublar vídeo
        </button>

        <div
            class="status"
            id="statusBox"
        >

            <div
                class="status-title"
                id="statusTitle"
            >
                Processando...
            </div>

            <div id="statusText">
                Aguarde...
            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>

        <div
            class="result"
            id="resultBox"
        >

            <strong>
                ✅ Dublagem concluída!
            </strong>

            <div>
                Seu áudio dublado foi gerado pela ElevenLabs.
            </div>

            <a
                id="resultLink"
                href="#"
                target="_blank"
            >
                ▶️ Ouvir / abrir resultado
            </a>

        </div>

    </div>

    <div
        class="connection"
        id="connection"
    >
        Verificando servidor...
    </div>

    <div class="footer">
        SI — Tradutor & Dublagem IA
    </div>

</div>

<script>

const BACKEND_URL =
    "https://si-u2ul.onrender.com";

const videoInput =
    document.getElementById("videoInput");

const videoPreview =
    document.getElementById("videoPreview");

const preview =
    document.getElementById("preview");

const dubButton =
    document.getElementById("dubButton");

const targetLang =
    document.getElementById("targetLang");

const statusBox =
    document.getElementById("statusBox");

const statusTitle =
    document.getElementById("statusTitle");

const statusText =
    document.getElementById("statusText");

const progressBar =
    document.getElementById("progressBar");

const resultBox =
    document.getElementById("resultBox");

const resultLink =
    document.getElementById("resultLink");

const connection =
    document.getElementById("connection");

let selectedFile = null;


/* =====================================================
   VERIFICAR SERVIDOR
===================================================== */

async function checkServer() {

    try {

        const response = await fetch(
            BACKEND_URL + "/api/health"
        );

        const data =
            await response.json();

        if (data.ok) {

            connection.textContent =
                "🟢 Servidor conectado";

        } else {

            connection.textContent =
                "🔴 ElevenLabs não configurada no servidor";
        }

    } catch (error) {

        connection.textContent =
            "🔴 Servidor offline ou iniciando";
    }
}

checkServer();


/* =====================================================
   SELECIONAR VÍDEO
===================================================== */

videoInput.addEventListener(
    "change",
    function () {

        selectedFile =
            this.files[0];

        if (!selectedFile) {

            dubButton.disabled = true;

            return;
        }

        const videoURL =
            URL.createObjectURL(selectedFile);

        videoPreview.src =
            videoURL;

        preview.style.display =
            "block";

        dubButton.disabled =
            false;

        resultBox.style.display =
            "none";

        statusBox.style.display =
            "none";

    }
);


/* =====================================================
   DUBLAR
===================================================== */

dubButton.addEventListener(
    "click",
    async function () {

        if (!selectedFile) {

            alert(
                "Escolha um vídeo primeiro."
            );

            return;
        }

        dubButton.disabled =
            true;

        statusBox.style.display =
            "block";

        resultBox.style.display =
            "none";

        progressBar.style.width =
            "10%";

        statusTitle.textContent =
            "Enviando vídeo";

        statusText.textContent =
            "Aguarde enquanto o vídeo é enviado para a ElevenLabs...";

        const formData =
            new FormData();

        formData.append(
            "video",
            selectedFile
        );

        formData.append(
            "targetLang",
            targetLang.value
        );

        try {

            const response =
                await fetch(
                    BACKEND_URL +
                    "/api/test-upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();

            if (!response.ok || !data.ok) {

                throw new Error(
                    data.error ||
                    "Erro ao enviar vídeo."
                );
            }

            const jobId =
                data.jobId;

            progressBar.style.width =
                "25%";

            statusTitle.textContent =
                "Processando vídeo";

            statusText.textContent =
                "A ElevenLabs está transcrevendo, traduzindo e gerando a dublagem...";

            pollStatus(jobId);

        } catch (error) {

            statusTitle.textContent =
                "❌ Erro";

            statusText.textContent =
                error.message;

            progressBar.style.width =
                "0%";

            dubButton.disabled =
                false;
        }

    }
);


/* =====================================================
   CONSULTAR STATUS
===================================================== */

async function pollStatus(jobId) {

    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/status/" +
                jobId
            );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Erro consultando processamento."
            );
        }

        const status =
            data.status;

        statusText.textContent =
            data.message ||
            "Processando...";


        if (status === "queued") {

            progressBar.style.width =
                "20%";

        }

        else if (status === "processing") {

            progressBar.style.width =
                "35%";

        }

        else if (status === "waiting") {

            progressBar.style.width =
                "50%";

        }

        else if (status === "dubbing") {

            progressBar.style.width =
                "75%";

        }

        else if (status === "completed") {

            progressBar.style.width =
                "100%";

            statusTitle.textContent =
                "✅ Concluído";

            statusText.textContent =
                "Sua dublagem foi gerada.";

            resultBox.style.display =
                "block";

            if (data.output_url) {

                resultLink.href =
                    data.output_url;

            }

            dubButton.disabled =
                false;

            return;
        }

        else if (status === "error") {

            progressBar.style.width =
                "0%";

            statusTitle.textContent =
                "❌ Erro";

            statusText.textContent =
                data.message ||
                "A dublagem falhou.";

            dubButton.disabled =
                false;

            return;
        }

        setTimeout(
            function () {
                pollStatus(jobId);
            },
            5000
        );

    } catch (error) {

        statusTitle.textContent =
            "❌ Erro";

        statusText.textContent =
            error.message;

        dubButton.disabled =
            false;
    }

}

</script>

</body>

</html>
