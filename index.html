<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dublagem automática de vídeos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="topbar">
      <div>
        <div>Olá, <span class="user-name" id="userName"></span></div>
      </div>
      <button class="logout" id="logoutBtn">Sair</button>
    </div>

    <h1>Dublagem automática de vídeos</h1>
    <p class="sub">Envie um vídeo seu e escolha o idioma da dublagem.</p>

    <form id="form">
      <label for="video">Vídeo</label>
      <input type="file" id="video" name="video" accept="video/*" required>

      <label for="targetLang">Idioma de destino</label>
      <select id="targetLang" name="targetLang">
        <option value="pt">Português</option>
        <option value="en">Inglês</option>
        <option value="es">Espanhol</option>
      </select>

      <button type="submit" id="submitBtn">Dublar vídeo</button>
    </form>

    <div id="status"></div>

    <div class="video-list" id="videoList">
      <p class="sub">Carregando seus vídeos...</p>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:3000";
    const token = localStorage.getItem("token");
    const user = JSON.parse(localStorage.getItem("user") || "null");

    // Sem login -> manda pra tela de entrar
    if (!token || !user) {
      window.location.href = "login.html";
    }

    document.getElementById("userName").textContent = user.name;

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "login.html";
    });

    function authHeaders(extra = {}) {
      return { Authorization: `Bearer ${token}`, ...extra };
    }

    // Se o token expirou/for inválido, volta pro login
    async function checkAuth() {
      const res = await fetch(`${API_BASE}/api/me`, { headers: authHeaders() });
      if (!res.ok) {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login.html";
      }
    }
    checkAuth();

    const form = document.getElementById("form");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.innerHTML = "";

      const fileInput = document.getElementById("video");
      const targetLang = document.getElementById("targetLang").value;
      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append("video", fileInput.files[0]);
      formData.append("targetLang", targetLang);

      try {
        const res = await fetch(`${API_BASE}/api/dublar`, {
          method: "POST",
          headers: authHeaders(),
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Erro ao enviar o vídeo.");

        statusEl.innerHTML = `
          <div class="stage" id="stageText">Na fila...</div>
          <div class="bar-bg" id="barBg" style="display:block">
            <div class="bar-fill" id="barFill"></div>
          </div>
        `;

        pollStatus(data.jobId);
      } catch (err) {
        statusEl.innerHTML = `<div class="error">${err.message}</div>`;
        submitBtn.disabled = false;
      }
    });

    function pollStatus(jobId) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`${API_BASE}/api/status/${jobId}`, { headers: authHeaders() });
          const data = await res.json();

          document.getElementById("stageText").textContent = data.stage || data.status;
          document.getElementById("barFill").style.width = `${data.progress || 0}%`;

          if (data.status === "done") {
            clearInterval(interval);
            statusEl.innerHTML += `<a class="download" href="#" data-job="${jobId}">Baixar vídeo dublado</a>`;
            submitBtn.disabled = false;
            loadMyVideos();
          }

          if (data.status === "error") {
            clearInterval(interval);
            statusEl.innerHTML += `<div class="error">Erro: ${data.error}</div>`;
            submitBtn.disabled = false;
            loadMyVideos();
          }
        } catch (err) {
          clearInterval(interval);
          statusEl.innerHTML += `<div class="error">Falha ao consultar status.</div>`;
          submitBtn.disabled = false;
        }
      }, 2000);
    }

    // Baixa o vídeo passando o token (a rota /outputs exige login)
    async function downloadVideo(jobId) {
      const res = await fetch(`${API_BASE}/outputs/${jobId}.mp4`, { headers: authHeaders() });
      if (!res.ok) return alert("Não foi possível baixar o vídeo.");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${jobId}.mp4`;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.addEventListener("click", (e) => {
      if (e.target.matches("a.download[data-job]")) {
        e.preventDefault();
        downloadVideo(e.target.dataset.job);
      }
    });

    const statusLabels = {
      queued: "Na fila",
      processing: "Processando",
      done: "Concluído",
      error: "Erro",
    };

    async function loadMyVideos() {
      const listEl = document.getElementById("videoList");
      try {
        const res = await fetch(`${API_BASE}/api/meus-videos`, { headers: authHeaders() });
        const data = await res.json();

        if (!data.videos.length) {
          listEl.innerHTML = `<p class="sub">Você ainda não enviou nenhum vídeo.</p>`;
          return;
        }

        listEl.innerHTML = data.videos
          .map((v) => {
            const date = new Date(v.createdAt).toLocaleString("pt-BR");
            const badge = `<span class="badge ${v.status}">${statusLabels[v.status] || v.status}</span>`;
            const downloadLink =
              v.status === "done"
                ? `<a class="download" href="#" data-job="${v.id}">Baixar</a>`
                : "";
            return `
              <div class="video-item">
                <div class="filename">${v.originalFilename || v.id}${badge}</div>
                <div class="meta">${date} · idioma: ${v.targetLang}</div>
                ${downloadLink}
              </div>
            `;
          })
          .join("");
      } catch (err) {
        listEl.innerHTML = `<p class="error">Erro ao carregar seus vídeos.</p>`;
      }
    }

    loadMyVideos();
  </script>
</body>
</html>
