<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dublagem automática de vídeos</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #2a2e38;
      --text: #e8e9ec;
      --text-muted: #9a9da6;
      --accent: #6c5ce7;
      --accent-hover: #5b4bd1;
      --success: #2ecc71;
      --error: #e74c3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      height: fit-content;
    }

    h1 { font-size: 22px; margin: 0 0 8px; }
    p.sub { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="file"], select {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #11131a;
      color: var(--text);
      margin-bottom: 16px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.5;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: #11131a;
      border-radius: 4px;
      overflow: hidden;
      margin: 12px 0;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .stage { color: var(--text-muted); font-size: 13px; }
    .error { color: var(--error); }
    .success { color: var(--success); }

    a.download {
      display: inline-block;
      margin-top: 12px;
      color: var(--success);
      text-decoration: none;
      font-weight: 600;
    }

    .server-status {
      margin-top: 18px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Dublagem automática de vídeos</h1>
    <p class="sub">
      Envie um vídeo e escolha o idioma para gerar uma nova faixa de áudio dublada.
    </p>

    <form id="form">
      <label for="video">Vídeo</label>
      <input type="file" id="video" name="video" accept="video/*" required>

      <label for="targetLang">Idioma de destino</label>
      <select id="targetLang" name="targetLang">
        <option value="pt">Português</option>
        <option value="en">Inglês</option>
        <option value="es">Espanhol</option>
      </select>

      <button type="submit" id="submitBtn">Dublar vídeo</button>
    </form>

    <div id="status"></div>
    <div class="server-status" id="serverStatus">Verificando servidor...</div>
  </div>

  <script>
    // IMPORTANTE:
    // Este endereço precisa ser o endereço público do seu backend no Render.
    const API_BASE = "https://repository-name-tradutor-ia-0h2r.onrender.com";

    const form = document.getElementById("form");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const serverStatus = document.getElementById("serverStatus");

    async function checkServer() {
      try {
        const res = await fetch(`${API_BASE}/api/health`);
        if (!res.ok) throw new Error("Servidor respondeu com erro");
        const data = await res.json();

        if (data.ok) {
          serverStatus.textContent = "Servidor conectado ✓";
          serverStatus.className = "server-status success";
        } else {
          throw new Error("Backend não está saudável");
        }
      } catch (err) {
        serverStatus.textContent =
          "Backend não conectado. Verifique a URL do Render.";
        serverStatus.className = "server-status error";
      }
    }

    checkServer();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById("video");
      const targetLang = document.getElementById("targetLang").value;

      if (!fileInput.files.length) {
        statusEl.innerHTML = '<div class="error">Escolha um vídeo.</div>';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Enviando...";
      statusEl.innerHTML = "";

      const formData = new FormData();
      formData.append("video", fileInput.files[0]);
      formData.append("targetLang", targetLang);

      try {
        const res = await fetch(`${API_BASE}/api/dublar`, {
          method: "POST",
          body: formData
        });

        const text = await res.text();
        let data = {};

        try {
          data = JSON.parse(text);
        } catch {
          throw new Error("O servidor retornou uma resposta inválida.");
        }

        if (!res.ok) {
          throw new Error(data.error || "Erro ao enviar o vídeo.");
        }

        statusEl.innerHTML = `
          <div class="stage" id="stageText">Na fila...</div>
          <div class="bar-bg">
            <div class="bar-fill" id="barFill"></div>
          </div>
        `;

        pollStatus(data.jobId);

      } catch (err) {
        statusEl.innerHTML =
          `<div class="error">${escapeHtml(err.message)}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Dublar vídeo";
      }
    });

    function pollStatus(jobId) {
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`${API_BASE}/api/status/${jobId}`);
          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || "Erro ao consultar o job.");
          }

          const stageText = document.getElementById("stageText");
          const barFill = document.getElementById("barFill");

          if (stageText) stageText.textContent = data.stage || data.status;
          if (barFill) barFill.style.width = `${data.progress || 0}%`;

          if (data.status === "done") {
            clearInterval(interval);

            statusEl.innerHTML = `
              <div class="success">Vídeo dublado com sucesso!</div>
              <a class="download"
                 href="${API_BASE}${data.downloadUrl}"
                 target="_blank"
                 rel="noopener">
                Baixar vídeo dublado
              </a>
            `;

            submitBtn.disabled = false;
            submitBtn.textContent = "Dublar outro vídeo";
          }

          if (data.status === "error") {
            clearInterval(interval);

            statusEl.innerHTML =
              `<div class="error">Erro: ${escapeHtml(data.error || "Falha no processamento.")}</div>`;

            submitBtn.disabled = false;
            submitBtn.textContent = "Tentar novamente";
          }

        } catch (err) {
          clearInterval(interval);
          statusEl.innerHTML =
            `<div class="error">Falha ao consultar o status: ${escapeHtml(err.message)}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "Tentar novamente";
        }
      }, 2000);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
