<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SI Tradutor Live — Tradução em Tempo Real</title>

  <meta
    name="description"
    content="SI Tradutor Live: assista a transmissões do YouTube e acompanhe a tradução para português."
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #111827,
          #1e293b
        );

      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 25px 10px 20px;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 16px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #f59e0b;
      display: inline-block;
    }

    .status-dot.online {
      background: #22c55e;
    }

    .status-dot.error {
      background: #ef4444;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      background: #ffffff;
      color: #111827;
      margin-bottom: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .start-btn {
      background: #22c55e;
      color: #ffffff;
      flex: 1;
    }

    .stop-btn {
      background: #ef4444;
      color: #ffffff;
      flex: 1;
    }

    .audio-btn {
      background: #2563eb;
      color: #ffffff;
      flex: 1;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 16px;
      background: #000000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .empty-video {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #94a3b8;
      padding: 20px;
    }

    .translation-box {
      min-height: 130px;
      border-radius: 14px;
      padding: 18px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .translation-title {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    #translation {
      font-size: 23px;
      line-height: 1.5;
      font-weight: 600;
    }

    .message {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(239,68,68,0.15);
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 20px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .logo {
        font-size: 28px;
      }

      .card {
        padding: 15px;
      }

      #translation {
        font-size: 19px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">
        🎙️ SI Tradutor Live
      </div>

      <div class="subtitle">
        Tradução de transmissões ao vivo para português
      </div>
    </header>


    <!-- STATUS -->

    <div class="card">

      <div class="status">
        <span
          id="statusDot"
          class="status-dot"
        ></span>

        <span id="connectionStatus">
          Verificando conexão com o servidor...
        </span>
      </div>

      <label for="youtubeUrl">
        Cole o link da YouTube Live
      </label>

      <input
        id="youtubeUrl"
        type="url"
        placeholder="https://www.youtube.com/live/..."
        autocomplete="off"
      >

      <label for="targetLang">
        Idioma da tradução
      </label>

      <select id="targetLang">

        <option value="pt">
          🇧🇷 Português
        </option>

        <option value="en">
          🇺🇸 Inglês
        </option>

        <option value="es">
          🇪🇸 Espanhol
        </option>

        <option value="fr">
          🇫🇷 Francês
        </option>

        <option value="de">
          🇩🇪 Alemão
        </option>

        <option value="it">
          🇮🇹 Italiano
        </option>

        <option value="ja">
          🇯🇵 Japonês
        </option>

        <option value="ko">
          🇰🇷 Coreano
        </option>

        <option value="zh">
          🇨🇳 Chinês
        </option>

        <option value="ar">
          🇸🇦 Árabe
        </option>

      </select>


      <div class="buttons">

        <button
          id="startButton"
          class="start-btn"
          onclick="startLive()"
        >
          🔴 Iniciar tradução
        </button>

        <button
          id="stopButton"
          class="stop-btn"
          onclick="stopLive()"
          disabled
        >
          🛑 Parar
        </button>

        <button
          id="audioButton"
          class="audio-btn"
          onclick="enableAudio()"
          disabled
        >
          🔊 Ativar áudio
        </button>

      </div>

      <div
        id="message"
        class="message"
      >
        Cole o link da YouTube Live para começar.
      </div>

    </div>


    <!-- VÍDEO -->

    <div class="card">

      <div class="live-indicator">
        <span class="live-dot"></span>
        YouTube Live
      </div>

      <div
        id="videoWrapper"
        class="video-wrapper"
      >

        <div class="empty-video">
          O vídeo da live aparecerá aqui.
        </div>

      </div>

    </div>


    <!-- TRADUÇÃO -->

    <div class="card">

      <div class="translation-box">

        <div class="translation-title">
          📝 Tradução em português
        </div>

        <div id="translation">
          A tradução aparecerá aqui...
        </div>

      </div>

    </div>


    <footer>
      SI Tradutor Live • Powered by ElevenLabs
    </footer>

  </div>


<script>

  // =====================================================
  // CONFIGURAÇÃO
  // =====================================================

  const BACKEND_URL =
    "https://si-u2ul.onrender.com";

  let liveId = null;

  let statusTimer = null;

  let audioEventSource = null;

  let audioEnabled = false;

  let audioContext = null;


  // =====================================================
  // ELEMENTOS
  // =====================================================

  const youtubeUrl =
    document.getElementById(
      "youtubeUrl"
    );

  const targetLang =
    document.getElementById(
      "targetLang"
    );

  const startButton =
    document.getElementById(
      "startButton"
    );

  const stopButton =
    document.getElementById(
      "stopButton"
    );

  const audioButton =
    document.getElementById(
      "audioButton"
    );

  const message =
    document.getElementById(
      "message"
    );

  const translation =
    document.getElementById(
      "translation"
    );

  const videoWrapper =
    document.getElementById(
      "videoWrapper"
    );

  const connectionStatus =
    document.getElementById(
      "connectionStatus"
    );

  const statusDot =
    document.getElementById(
      "statusDot"
    );


  // =====================================================
  // MENSAGEM
  // =====================================================

  function showMessage(text) {

    message.textContent =
      text || "";

  }


  // =====================================================
  // YOUTUBE ID
  // =====================================================

  function getYouTubeId(url) {

    if (!url) {
      return null;
    }

    const patterns = [

      /youtube\.com\/live\/([^?&#/]+)/i,

      /youtube\.com\/watch\?v=([^&#]+)/i,

      /youtu\.be\/([^?&#/]+)/i,

      /youtube\.com\/embed\/([^?&#/]+)/i

    ];

    for (
      const pattern
      of patterns
    ) {

      const match =
        url.match(pattern);

      if (match) {

        return match[1];

      }

    }

    return null;

  }


  // =====================================================
  // MOSTRAR VÍDEO
  // =====================================================

  function showYouTubeVideo(
    videoId
  ) {

    if (!videoId) {

      videoWrapper.innerHTML = `
        <div class="empty-video">
          Não foi possível identificar o vídeo.
        </div>
      `;

      return;

    }

    const iframeUrl =
      "https://www.youtube.com/embed/"
      + encodeURIComponent(videoId)
      + "?autoplay=1&rel=0";

    videoWrapper.innerHTML = `

      <iframe
        src="${iframeUrl}"
        title="YouTube Live"
        allow="
          autoplay;
          encrypted-media;
          picture-in-picture;
          web-share
        "
        allowfullscreen
      ></iframe>

    `;

  }


  // =====================================================
  // VERIFICAR SERVIDOR
  // =====================================================

  async function checkServer() {

    try {

      const response =
        await fetch(
          BACKEND_URL +
          "/api/health"
        );

      const data =
        await response.json();

      if (
        response.ok &&
        data.ok
      ) {

        connectionStatus.textContent =
          "Servidor conectado à ElevenLabs";

        statusDot.classList.add(
          "online"
        );

        statusDot.classList.remove(
          "error"
        );

      } else {

        throw new Error(
          data.message ||
          "Servidor não conectado."
        );

      }

    } catch (error) {

      connectionStatus.textContent =
        "Servidor não conectado";

      statusDot.classList.remove(
        "online"
      );

      statusDot.classList.add(
        "error"
      );

    }

  }


  // =====================================================
  // INICIAR LIVE
  // =====================================================

  async function startLive() {

    const url =
      youtubeUrl.value.trim();

    if (!url) {

      showMessage(
        "Cole primeiro o link da YouTube Live."
      );

      return;

    }

    const videoId =
      getYouTubeId(url);

    if (!videoId) {

      showMessage(
        "Não consegui identificar o vídeo do YouTube."
      );

      return;

    }


    startButton.disabled =
      true;

    stopButton.disabled =
      false;

    audioButton.disabled =
      false;


    translation.textContent =
      "Conectando à transmissão...";


    showYouTubeVideo(
      videoId
    );


    showMessage(
      "Conectando a live ao servidor..."
    );


    try {

      const response =
        await fetch(
          BACKEND_URL +
          "/api/youtube-live",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              url: url,

              targetLang:
                targetLang.value

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok || !data.ok) {

        throw new Error(
          data.error ||
          data.message ||
          "Erro iniciando a live."
        );

      }


      liveId =
        data.liveId;


      showMessage(
        "🟢 Live conectada. "
        + "Aguardando áudio da transmissão..."
      );


      startStatusPolling();

      startAudioStream();


    } catch (error) {

      showMessage(
        "❌ " +
        error.message
      );

      startButton.disabled =
        false;

      stopButton.disabled =
        true;

      audioButton.disabled =
        true;

    }

  }


  // =====================================================
  // STATUS
  // =====================================================

  function startStatusPolling() {

    if (statusTimer) {

      clearInterval(
        statusTimer
      );

    }

    statusTimer =
      setInterval(
        checkLiveStatus,
        3000
      );

    checkLiveStatus();

  }


  async function checkLiveStatus() {

    if (!liveId) {
      return;
    }

    try {

      const response =
        await fetch(
          BACKEND_URL +
          "/api/youtube-live/" +
          encodeURIComponent(
            liveId
          )
        );

      const data =
        await response.json();


      if (!response.ok || !data.ok) {

        return;

      }


      if (
        data.lastTranscript
      ) {

        translation.textContent =
          "Ouvindo: " +
          data.lastTranscript;

      }


      if (
        data.lastTranslation
      ) {

        translation.textContent =
          data.lastTranslation;

      }


      if (
        data.audioCapture ===
        "running"
      ) {

        showMessage(
          "🟢 Áudio da live sendo capturado."
        );

      }


      if (
        data.error
      ) {

        showMessage(
          "⚠️ " +
          data.error
        );

      }


      if (
        data.status ===
        "error"
      ) {

        showMessage(
          "❌ " +
          (
            data.error ||
            data.message ||
            "Erro no processamento."
          )
        );

      }

    } catch (error) {

      console.log(
        "Erro status:",
        error
      );

    }

  }


  // =====================================================
  // STREAM DE ÁUDIO
  // =====================================================

  function startAudioStream() {

    if (!liveId) {
      return;
    }


    if (audioEventSource) {

      audioEventSource.close();

    }


    const url =
      BACKEND_URL +
      "/api/youtube-live/" +
      encodeURIComponent(
        liveId
      ) +
      "/audio";


    audioEventSource =
      new EventSource(
        url
      );


    audioEventSource.onmessage =
      function(event) {

        try {

          const data =
            JSON.parse(
              event.data
            );


          if (
            data.audio
          ) {

            playBase64Audio(
              data.audio
            );

          }

        } catch (error) {

          console.log(
            "Erro no áudio:",
            error
          );

        }

      };


    audioEventSource.onerror =
      function() {

        console.log(
          "Stream de áudio desconectado."
        );

      };

  }


  // =====================================================
  // ATIVAR ÁUDIO
  // =====================================================

  async function enableAudio() {

    try {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();

      }


      audioEnabled =
        true;


      audioButton.textContent =
        "🔊 Áudio ativado";

      audioButton.disabled =
        true;


      showMessage(
        "🔊 Áudio da tradução ativado."
      );

    } catch (error) {

      showMessage(
        "Não foi possível ativar o áudio: "
        + error.message
      );

    }

  }


  // =====================================================
  // REPRODUZIR ÁUDIO BASE64
  // =====================================================

  async function playBase64Audio(
    base64
  ) {

    if (!audioEnabled) {
      return;
    }

    try {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if (
        audioContext.state ===
        "suspended"
      ) {

        await audioContext.resume();

      }


      const binary =
        atob(base64);

      const bytes =
        new Uint8Array(
          binary.length
        );


      for (
        let i = 0;
        i < binary.length;
        i++
      ) {

        bytes[i] =
          binary.charCodeAt(i);

      }


      /*
        O Agent está configurado
        para PCM 16 kHz mono.

        Cada amostra possui
        16 bits = 2 bytes.
      */

      const sampleRate =
        16000;

      const samples =
        new Int16Array(
          bytes.buffer
        );


      const audioBuffer =
        audioContext.createBuffer(
          1,
          samples.length,
          sampleRate
        );


      const channel =
        audioBuffer.getChannelData(
          0
        );


      for (
        let i = 0;
        i < samples.length;
        i++
      ) {

        channel[i] =
          samples[i] / 32768;

      }


      const source =
        audioContext.createBufferSource();


      source.buffer =
        audioBuffer;


      source.connect(
        audioContext.destination
      );


      source.start();

    } catch (error) {

      console.log(
        "Erro reproduzindo áudio:",
        error
      );

    }

  }


  // =====================================================
  // PARAR LIVE
  // =====================================================

  async function stopLive() {

    if (!liveId) {

      resetInterface();

      return;

    }


    try {

      await fetch(
        BACKEND_URL +
        "/api/youtube-live/" +
        encodeURIComponent(
          liveId
        ) +
        "/stop",
        {
          method: "POST"
        }
      );

    } catch (error) {

      console.log(
        error
      );

    }


    if (statusTimer) {

      clearInterval(
        statusTimer
      );

      statusTimer =
        null;

    }


    if (audioEventSource) {

      audioEventSource.close();

      audioEventSource =
        null;

    }


    liveId =
      null;


    resetInterface();

  }


  // =====================================================
  // RESET
  // =====================================================

  function resetInterface() {

    startButton.disabled =
      false;

    stopButton.disabled =
      true;

    audioButton.disabled =
      true;

    audioButton.textContent =
      "🔊 Ativar áudio";

    audioEnabled =
      false;


    showMessage(
      "Live parada."
    );


    translation.textContent =
      "A tradução aparecerá aqui...";

  }


  // =====================================================
  // INICIAR
  // =====================================================

  checkServer();

</script>

</body>
</html>
