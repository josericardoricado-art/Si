<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SI Tradutor Live</title>

  <meta
    name="description"
    content="SI Tradutor Live - tradução e dublagem de vídeos e transmissões."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb7ca;
      margin-bottom: 25px;
    }

    .card {
      background: #151c30;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      border: 1px solid #27304a;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      background: #27304a;
      color: white;
      font-size: 15px;
    }

    .tab.active {
      background: #2792dc;
    }

    .mode {
      display: none;
    }

    .mode.active {
      display: block;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #39445f;
      background: #0e1425;
      color: white;
      font-size: 16px;
    }

    input[type="file"] {
      padding: 12px;
    }

    button.action {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #2792dc;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #b52b3a;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #0e1425;
      color: #cbd3e5;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .video-box {
      margin-top: 20px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      display: none;
    }

    .video-box iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .connection {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #8fe3a5;
    }

    .warning {
      color: #ffd27a;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .success {
      color: #8fe3a5;
    }

    .error {
      color: #ff7d8a;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎙️ SI Tradutor Live</h1>

  <div class="subtitle">
    Tradução e dublagem com ElevenLabs
  </div>

  <div class="card">

    <div class="tabs">

      <button
        class="tab active"
        id="videoTab"
        onclick="showMode('video')"
      >
        🎬 Vídeo
      </button>

      <button
        class="tab"
        id="liveTab"
        onclick="showMode('live')"
      >
        🔴 YouTube Live
      </button>

    </div>


    <!-- =====================================================
         VÍDEO
    ====================================================== -->

    <div
      id="videoMode"
      class="mode active"
    >

      <label>
        Escolha o vídeo
      </label>

      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >

      <label>
        Traduzir para
      </label>

      <select id="videoLanguage">

        <option value="pt">
          🇧🇷 Português
        </option>

        <option value="en">
          🇺🇸 Inglês
        </option>

        <option value="es">
          🇪🇸 Espanhol
        </option>

        <option value="fr">
          🇫🇷 Francês
        </option>

        <option value="de">
          🇩🇪 Alemão
        </option>

        <option value="it">
          🇮🇹 Italiano
        </option>

        <option value="ja">
          🇯🇵 Japonês
        </option>

        <option value="ko">
          🇰🇷 Coreano
        </option>

        <option value="zh">
          🇨🇳 Chinês
        </option>

        <option value="ar">
          🇸🇦 Árabe
        </option>

      </select>

      <button
        class="action"
        id="videoButton"
        onclick="sendVideo()"
      >
        🎬 DUBLAR VÍDEO
      </button>

      <div
        class="status"
        id="videoStatus"
      >
        Aguardando vídeo...
      </div>

    </div>


    <!-- =====================================================
         YOUTUBE LIVE
    ====================================================== -->

    <div
      id="liveMode"
      class="mode"
    >

      <label>
        Cole o link da YouTube Live
      </label>

      <input
        type="url"
        id="youtubeUrl"
        placeholder="https://www.youtube.com/live/..."
        autocomplete="off"
      >

      <label>
        Traduzir para
      </label>

      <select id="liveLanguage">

        <option value="pt">
          🇧🇷 Português
        </option>

        <option value="en">
          🇺🇸 Inglês
        </option>

        <option value="es">
          🇪🇸 Espanhol
        </option>

        <option value="fr">
          🇫🇷 Francês
        </option>

        <option value="de">
          🇩🇪 Alemão
        </option>

        <option value="it">
          🇮🇹 Italiano
        </option>

        <option value="ja">
          🇯🇵 Japonês
        </option>

        <option value="ko">
          🇰🇷 Coreano
        </option>

        <option value="zh">
          🇨🇳 Chinês
        </option>

        <option value="ar">
          🇸🇦 Árabe
        </option>

      </select>

      <button
        class="action"
        id="liveButton"
        onclick="startLive()"
      >
        🔴 INICIAR LIVE
      </button>

      <button
        class="action stop"
        id="stopButton"
        onclick="stopLive()"
        style="display:none"
      >
        ⏹️ PARAR
      </button>

      <div
        class="status"
        id="liveStatus"
      >
        Aguardando link da live...
      </div>

      <div
        class="video-box"
        id="youtubePlayer"
      >

        <iframe
          id="youtubeFrame"
          title="YouTube Live"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen
        ></iframe>

      </div>

      <div class="warning">
        ⚠️ A live será exibida aqui. A captura e tradução
        automática do áudio da transmissão será ligada na
        próxima etapa.
      </div>

    </div>

  </div>

  <div
    class="connection"
    id="connectionStatus"
  >
    🔄 Verificando servidor...
  </div>

</div>


<script>

/* ==========================================================
   CONFIGURAÇÃO
========================================================== */

const BACKEND_URL =
  "https://si-u2ul.onrender.com";

const AGENT_ID =
  "agent_1601m1q929bhf2zvts65479fyzdw";

let agentSocket = null;
let signedUrl = null;


/* ==========================================================
   TROCAR ABA
========================================================== */

function showMode(mode) {

  const videoMode =
    document.getElementById("videoMode");

  const liveMode =
    document.getElementById("liveMode");

  const videoTab =
    document.getElementById("videoTab");

  const liveTab =
    document.getElementById("liveTab");


  if (mode === "video") {

    videoMode.classList.add("active");
    liveMode.classList.remove("active");

    videoTab.classList.add("active");
    liveTab.classList.remove("active");

  } else {

    videoMode.classList.remove("active");
    liveMode.classList.add("active");

    videoTab.classList.remove("active");
    liveTab.classList.add("active");

  }

}


/* ==========================================================
   TESTAR SERVIDOR
========================================================== */

async function checkHealth() {

  const status =
    document.getElementById(
      "connectionStatus"
    );

  try {

    const response =
      await fetch(
        BACKEND_URL + "/api/health"
      );

    const data =
      await response.json();

    if (data.ok) {

      status.textContent =
        "🟢 Servidor conectado à ElevenLabs";

    } else {

      status.textContent =
        "🔴 " +
        (data.message || "Erro no servidor.");

    }

  } catch (error) {

    status.textContent =
      "🔴 Não foi possível conectar ao servidor.";

  }

}


/* ==========================================================
   IDENTIFICAR ID DO YOUTUBE
========================================================== */

function getYouTubeId(url) {

  if (!url) {
    return null;
  }

  url = url.trim();


  /* -----------------------------------------
     youtube.com/live/VIDEO_ID
  ----------------------------------------- */

  const liveMatch =
    url.match(
      /youtube\.com\/live\/([^?&#/]+)/i
    );

  if (liveMatch && liveMatch[1]) {

    return liveMatch[1];

  }


  /* -----------------------------------------
     youtube.com/watch?v=VIDEO_ID
  ----------------------------------------- */

  try {

    const parsed =
      new URL(url);

    const hostname =
      parsed.hostname.toLowerCase();

    const pathname =
      parsed.pathname;


    if (
      hostname === "youtube.com" ||
      hostname === "www.youtube.com" ||
      hostname === "m.youtube.com"
    ) {

      const videoId =
        parsed.searchParams.get("v");

      if (videoId) {

        return videoId;

      }


      /* -------------------------------------
         /embed/VIDEO_ID
      ------------------------------------- */

      const embedMatch =
        pathname.match(
          /^\/embed\/([^/]+)/i
        );

      if (embedMatch) {

        return embedMatch[1];

      }


      /* -------------------------------------
         /shorts/VIDEO_ID
      ------------------------------------- */

      const shortsMatch =
        pathname.match(
          /^\/shorts\/([^/]+)/i
        );

      if (shortsMatch) {

        return shortsMatch[1];

      }

    }


    /* -----------------------------------------
       youtu.be/VIDEO_ID
    ----------------------------------------- */

    if (
      hostname === "youtu.be" ||
      hostname === "www.youtu.be"
    ) {

      const id =
        pathname
          .replace(/^\/+/, "")
          .split("/")[0];

      if (id) {

        return id;

      }

    }

  } catch (error) {

    console.log(
      "Erro analisando URL:",
      error
    );

  }


  /* -----------------------------------------
     Última tentativa:
     procurar padrão v= ou /live/
  ----------------------------------------- */

  const fallback =
    url.match(
      /(?:v=|\/live\/|youtu\.be\/)([A-Za-z0-9_-]{6,})/i
    );

  if (fallback && fallback[1]) {

    return fallback[1];

  }


  return null;
}


/* ==========================================================
   ENVIAR VÍDEO
========================================================== */

async function sendVideo() {

  const input =
    document.getElementById(
      "videoInput"
    );

  const status =
    document.getElementById(
      "videoStatus"
    );

  const button =
    document.getElementById(
      "videoButton"
    );

  const language =
    document.getElementById(
      "videoLanguage"
    ).value;


  if (!input.files.length) {

    status.textContent =
      "❌ Escolha um vídeo primeiro.";

    return;

  }


  const formData =
    new FormData();

  formData.append(
    "video",
    input.files[0]
  );

  formData.append(
    "targetLang",
    language
  );


  button.disabled = true;

  status.textContent =
    "⏳ Enviando vídeo...";


  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/test-upload",
        {
          method: "POST",
          body: formData
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Erro enviando vídeo."
      );

    }


    status.textContent =
      "⏳ " +
      data.message;


    pollVideo(
      data.jobId,
      status,
      button
    );


  } catch (error) {

    status.textContent =
      "❌ " +
      error.message;

    button.disabled = false;

  }

}


/* ==========================================================
   ACOMPANHAR VÍDEO
========================================================== */

async function pollVideo(
  jobId,
  status,
  button
) {

  try {

    const response =
      await fetch(
        BACKEND_URL +
        "/api/status/" +
        jobId
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Erro consultando status."
      );

    }


    status.textContent =
      "⏳ " +
      (
        data.message ||
        data.status ||
        "Processando..."
      );


    if (
      data.status ===
      "completed"
    ) {

      status.innerHTML =
        "✅ Dublagem concluída!<br><br>" +

        "<a href=\"" +
        data.output_url +
        "\" target=\"_blank\" " +

        "style=\"color:#61c8ff\">" +

        "🔊 Abrir áudio dublado" +

        "</a>";


      button.disabled = false;

      return;

    }


    if (
      data.status ===
      "error"
    ) {

      status.textContent =
        "❌ " +
        data.message;

      button.disabled = false;

      return;

    }


    setTimeout(
      function() {

        pollVideo(
          jobId,
          status,
          button
        );

      },
      5000
    );


  } catch (error) {

    status.textContent =
      "❌ " +
      error.message;

    button.disabled = false;

  }

}


/* ==========================================================
   INICIAR YOUTUBE LIVE
========================================================== */

async function startLive() {

  const urlInput =
    document.getElementById(
      "youtubeUrl"
    );

  const status =
    document.getElementById(
      "liveStatus"
    );

  const startButton =
    document.getElementById(
      "liveButton"
    );

  const stopButton =
    document.getElementById(
      "stopButton"
    );

  const player =
    document.getElementById(
      "youtubePlayer"
    );

  const frame =
    document.getElementById(
      "youtubeFrame"
    );


  const youtubeUrl =
    urlInput.value.trim();


  const targetLanguage =
    document.getElementById(
      "liveLanguage"
    ).value;


  /* -----------------------------------------
     Verificar URL
  ----------------------------------------- */

  if (!youtubeUrl) {

    status.textContent =
      "❌ Cole o link da YouTube Live.";

    return;

  }


  /* -----------------------------------------
     Pegar ID
  ----------------------------------------- */

  const videoId =
    getYouTubeId(
      youtubeUrl
    );


  console.log(
    "YouTube ID:",
    videoId
  );


  if (!videoId) {

    status.textContent =
      "❌ Não consegui identificar o vídeo do YouTube.\n\n" +
      "Exemplo válido:\n" +
      "https://www.youtube.com/live/VIDEO_ID";

    return;

  }


  startButton.disabled =
    true;


  status.textContent =
    "⏳ Conectando à YouTube Live...";


  try {

    /* ---------------------------------------
       Avisar backend
    --------------------------------------- */

    const response =
      await fetch(
        BACKEND_URL +
        "/api/youtube-live",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            url:
              youtubeUrl,

            targetLang:
              targetLanguage

          })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Erro iniciando live."
      );

    }


    /* ---------------------------------------
       Mostrar YouTube
    --------------------------------------- */

    frame.src =
      "https://www.youtube.com/embed/" +
      encodeURIComponent(videoId) +
      "?autoplay=1";


    player.style.display =
      "block";


    /* ---------------------------------------
       Botões
    --------------------------------------- */

    startButton.style.display =
      "none";

    stopButton.style.display =
      "block";


    status.textContent =
      "🟢 YouTube Live conectada.\n\n" +
      "ID: " +
      videoId +
      "\n\n" +
      "⏳ Conectando ao SI Tradutor...";


    /* ---------------------------------------
       Conectar Agent
    --------------------------------------- */

    try {

      await connectAgent();

      status.textContent =
        "🟢 YouTube Live conectada.\n\n" +
        "🟢 SI Tradutor conectado ao Agent.";

    } catch (agentError) {

      status.textContent =
        "🟡 Live aberta, mas o Agent não conectou.\n\n" +
        agentError.message;

    }


  } catch (error) {

    status.textContent =
      "❌ " +
      error.message;

    startButton.disabled =
      false;

  }

}


/* ==========================================================
   CONECTAR ELEVENLABS AGENT
========================================================== */

async function connectAgent() {

  const response =
    await fetch(
      BACKEND_URL +
      "/api/agent/signed-url"
    );


  const data =
    await response.json();


  if (
    !response.ok ||
    !data.ok
  ) {

    throw new Error(
      data.error ||
      "Não foi possível conectar ao Agent."
    );

  }


  signedUrl =
    data.signedUrl;


  if (!signedUrl) {

    throw new Error(
      "O servidor não retornou a URL do Agent."
    );

  }


  agentSocket =
    new WebSocket(
      signedUrl
    );


  return new Promise(
    function(resolve, reject) {

      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }

            finished = true;

            try {
              agentSocket.close();
            } catch {}

            reject(
              new Error(
                "Tempo limite conectando ao Agent."
              )
            );

          },
          15000
        );


      agentSocket.onopen =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(
            timeout
          );

          console.log(
            "ElevenLabs Agent conectado."
          );

          resolve();

        };


      agentSocket.onmessage =
        function(event) {

          console.log(
            "ElevenLabs:",
            event.data
          );

        };


      agentSocket.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(
            timeout
          );

          reject(
            new Error(
              "Erro na conexão com o ElevenLabs Agent."
            )
          );

        };


      agentSocket.onclose =
        function() {

          console.log(
            "Conexão com Agent encerrada."
          );

        };

    }
  );

}


/* ==========================================================
   PARAR LIVE
========================================================== */

function stopLive() {

  const frame =
    document.getElementById(
      "youtubeFrame"
    );

  const player =
    document.getElementById(
      "youtubePlayer"
    );

  const status =
    document.getElementById(
      "liveStatus"
    );

  const startButton =
    document.getElementById(
      "liveButton"
    );

  const stopButton =
    document.getElementById(
      "stopButton"
    );


  if (agentSocket) {

    try {

      agentSocket.close();

    } catch {}

    agentSocket =
      null;

  }


  frame.src =
    "";


  player.style.display =
    "none";


  stopButton.style.display =
    "none";


  startButton.style.display =
    "block";


  startButton.disabled =
    false;


  status.textContent =
    "⏹️ Live parada.";

}


/* ==========================================================
   INICIAR SITE
========================================================== */

checkHealth();

</script>

</body>
  </html>
