name: Apply Piper playback fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch AudioCaptureService
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/com/si/tradutor/AudioCaptureService.kt')
          text = path.read_text(encoding='utf-8')

          if 'import android.media.AudioTrack' not in text:
              text = text.replace('import android.media.AudioRecord\n', 'import android.media.AudioRecord\nimport android.media.AudioTrack\n', 1)

          start = text.find('    private fun tocarWav(')
          end = text.find('    // =========================================================\n    // LIBERAR MEDIA PLAYER', start)
          if start < 0 or end < 0:
              raise SystemExit('Não encontrei a função tocarWav no formato esperado.')

          new_function = r'''    private fun tocarWav(
        item: OutputAudio
    ): Boolean {

        if (item.wav.isEmpty()) {
            Log.e(TAG, "WAV vazio")
            return false
        }

        var audioManager: AudioManager? = null
        var focusRequest: AudioFocusRequest? = null
        var track: AudioTrack? = null

        try {
            publicarDiagnostico("🔊 Piper recebido • preparando áudio")
            Log.d(TAG, "PIPER PLAYBACK: iniciando AudioTrack bytes=${item.wav.size}")

            audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
            audioManager.mode = AudioManager.MODE_NORMAL

            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                focusRequest = AudioFocusRequest.Builder(
                    AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK
                )
                    .setAudioAttributes(
                        AudioAttributes.Builder()
                            .setUsage(AudioAttributes.USAGE_MEDIA)
                            .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                            .build()
                    )
                    .setAcceptsDelayedFocusGain(false)
                    .build()
                Log.d(TAG, "PIPER AudioFocus=${audioManager.requestAudioFocus(focusRequest!!)}")
            } else {
                @Suppress("DEPRECATION")
                val focus = audioManager.requestAudioFocus(
                    null,
                    AudioManager.STREAM_MUSIC,
                    AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK
                )
                Log.d(TAG, "PIPER AudioFocus=$focus")
            }

            val info = extrairWavPcm(item.wav)
                ?: throw IllegalStateException("WAV Piper inválido ou sem PCM")

            val channelConfig = when (info.channels) {
                1 -> AudioFormat.CHANNEL_OUT_MONO
                2 -> AudioFormat.CHANNEL_OUT_STEREO
                else -> throw IllegalStateException("Canais WAV não suportados: ${info.channels}")
            }

            val minBuffer = AudioTrack.getMinBufferSize(
                info.sampleRate,
                channelConfig,
                AudioFormat.ENCODING_PCM_16BIT
            )
            if (minBuffer <= 0) {
                throw IllegalStateException("AudioTrack.getMinBufferSize falhou: $minBuffer")
            }

            track = AudioTrack.Builder()
                .setAudioAttributes(
                    AudioAttributes.Builder()
                        .setUsage(AudioAttributes.USAGE_MEDIA)
                        .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                        .build()
                )
                .setAudioFormat(
                    AudioFormat.Builder()
                        .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                        .setSampleRate(info.sampleRate)
                        .setChannelMask(channelConfig)
                        .build()
                )
                .setBufferSizeInBytes(maxOf(minBuffer, 8192))
                .setTransferMode(AudioTrack.MODE_STREAM)
                .build()

            if (track!!.state != AudioTrack.STATE_INITIALIZED) {
                throw IllegalStateException("AudioTrack não inicializado")
            }

            track!!.setVolume(1.0f)

            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                try {
                    val speaker = audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS)
                        .firstOrNull { it.type == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER }
                    if (speaker != null) {
                        Log.d(TAG, "PIPER speaker=${speaker.id} preferred=${track!!.setPreferredDevice(speaker)}")
                    }
                } catch (e: Exception) {
                    Log.w(TAG, "Não foi possível selecionar alto-falante interno", e)
                }
            }

            publicarDiagnostico("🔊 VOZ PIPER INICIANDO")
            track!!.play()

            var offset = 0
            while (offset < info.pcm.size && running && !stopping) {
                val count = track!!.write(
                    info.pcm,
                    offset,
                    info.pcm.size - offset,
                    AudioTrack.WRITE_BLOCKING
                )
                if (count < 0) {
                    throw IllegalStateException("AudioTrack.write retornou $count")
                }
                if (count == 0) {
                    Thread.sleep(10)
                } else {
                    offset += count
                }
            }

            if (offset <= 0) {
                throw IllegalStateException("AudioTrack não recebeu PCM")
            }

            val frameSize = info.channels * 2
            val frames = info.pcm.size / frameSize
            val durationMs = ((frames.toDouble() / info.sampleRate) * 1000.0).toLong()

            publicarDiagnostico("🔊 VOZ PIPER FALANDO NO ALTO-FALANTE")
            Log.d(TAG, "PIPER AudioTrack rate=${info.sampleRate} channels=${info.channels} duration=${durationMs}ms")

            val deadline = System.currentTimeMillis() + durationMs + 250L
            while (running && !stopping && System.currentTimeMillis() < deadline) {
                Thread.sleep(20)
            }

            try { track!!.stop() } catch (_: Exception) { }

            publicarDiagnostico("✅ VOZ PIPER TERMINOU")
            Log.d(TAG, "PIPER AudioTrack terminou audioId=${item.audioId}")
            return true

        } catch (e: InterruptedException) {
            Thread.currentThread().interrupt()
            lastError = e.message
            Log.e(TAG, "Playback Piper interrompido", e)
            publicarDiagnostico("⚠️ Voz Piper interrompida")
            return false

        } catch (e: Exception) {
            lastError = e.message
            Log.e(TAG, "ERRO REPRODUZINDO PIPER COM AUDIOTRACK", e)
            publicarDiagnostico("❌ Erro voz Piper: ${e.message ?: "desconhecido"}")
            return false

        } finally {
            try { track?.pause() } catch (_: Exception) { }
            try { track?.flush() } catch (_: Exception) { }
            try { track?.release() } catch (_: Exception) { }

            try {
                if (audioManager != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && focusRequest != null) {
                    audioManager.abandonAudioFocusRequest(focusRequest!!)
                } else if (audioManager != null) {
                    @Suppress("DEPRECATION")
                    audioManager.abandonAudioFocus(null)
                }
            } catch (e: Exception) {
                Log.w(TAG, "Erro liberando AudioFocus Piper", e)
            }
        }
    }

    private data class WavPcm(
        val sampleRate: Int,
        val channels: Int,
        val pcm: ByteArray
    )

    private fun extrairWavPcm(wav: ByteArray): WavPcm? {
        if (wav.size < 44) return null

        fun intLE(offset: Int): Int = ByteBuffer.wrap(wav, offset, 4)
            .order(ByteOrder.LITTLE_ENDIAN).int

        fun shortLE(offset: Int): Int = ByteBuffer.wrap(wav, offset, 2)
            .order(ByteOrder.LITTLE_ENDIAN).short.toInt() and 0xffff

        fun chunkName(offset: Int): String = String(wav, offset, 4, Charsets.US_ASCII)

        if (chunkName(0) != "RIFF" || chunkName(8) != "WAVE") return null

        var offset = 12
        var format = 0
        var channels = 0
        var sampleRate = 0
        var bits = 0
        var dataStart = -1
        var dataSize = 0

        while (offset + 8 <= wav.size) {
            val id = chunkName(offset)
            val size = intLE(offset + 4)
            if (size < 0) return null
            val dataOffset = offset + 8
            if (dataOffset > wav.size) return null
            val safeSize = minOf(size, wav.size - dataOffset)

            if (id == "fmt " && safeSize >= 16) {
                format = shortLE(dataOffset)
                channels = shortLE(dataOffset + 2)
                sampleRate = intLE(dataOffset + 4)
                bits = shortLE(dataOffset + 14)
            }
            if (id == "data") {
                dataStart = dataOffset
                dataSize = safeSize
                break
            }

            offset = dataOffset + size
            if (offset % 2 != 0) offset++
        }

        if (format != 1 || channels !in 1..2 || sampleRate <= 0 || bits != 16 || dataStart < 0 || dataSize <= 0) {
            return null
        }

        return WavPcm(
            sampleRate = sampleRate,
            channels = channels,
            pcm = wav.copyOfRange(dataStart, dataStart + dataSize)
        )
    }

'''

          text = text[:start] + new_function + text[end:]
          path.write_text(text, encoding='utf-8')
          print('Piper AudioTrack playback aplicado.')
          PY

      - name: Commit and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/si/tradutor/AudioCaptureService.kt
          git rm .github/workflows/fix-piper-playback.yml
          git commit -m "fix: Piper AudioTrack playback"
          git push